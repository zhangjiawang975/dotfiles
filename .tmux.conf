# Enable 256-color and true color (24-bit RGB) support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable mouse support
set -g mouse on

# Reduce ESC delay
set -g escape-time 10

# Window/pane index starts from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase scrollback history
set -g history-limit 50000

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Switch panes with Alt+arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Ctrl+arrow
bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 2
bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 2

# Reload config with r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Status bar style
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left "#[bg=#5e81ac,fg=#eceff4,bold] #S "
set -g status-right "#[bg=#4c566a,fg=#d8dee9] %Y-%m-%d %H:%M "
set -g status-left-length 20
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#88c0d0,fg=#2e3440,bold] #I:#W "

# Pane border style
set -g pane-border-style "fg=#4c566a"
set -g pane-active-border-style "fg=#88c0d0"
